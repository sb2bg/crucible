name: Feature request
description: Suggest a new capability or a change to an existing one.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the use case first, then the mechanism. "I want X because I am trying to do Y" is much easier to respond to than "please add X".

        For anything non-trivial, it is worth opening a discussion here first before you start writing a PR.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: The workflow or use case that is currently painful or impossible.
      placeholder: "When I run a release gate against three engines, I cannot ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like Crucible to do differently?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you did not pursue them.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps us understand the request. Screenshots and examples from other tools are welcome.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched existing issues and did not find a duplicate.
          required: true
        - label: This change fits the project scope described in CONTRIBUTING.md.
          required: true
